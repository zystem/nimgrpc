syntax = "proto3";

package hello;

// The service of the examples: one unary method and one that streams its replies.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
  int32 count = 2;   // SayHelloStream: how many replies; 0 means 3
}

message HelloReply {
  string message = 1;
}
