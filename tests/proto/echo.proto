syntax = "proto3";

package reflect.test;

import "google/protobuf/timestamp.proto";

// A small service for the reflection tests: a message with a nested type and an enum, a
// dependency on a well-known type, a unary and a streaming method.
message EchoRequest {
  string text = 1;
  google.protobuf.Timestamp sent = 2;
  enum Mood { CALM = 0; LOUD = 1; }
  Mood mood = 3;
  message Tag { string key = 1; string value = 2; }
  repeated Tag tags = 4;
}

message EchoReply {
  string text = 1;
}

service Echo {
  rpc Say(EchoRequest) returns (EchoReply);
  rpc Chat(stream EchoRequest) returns (stream EchoReply);
}
