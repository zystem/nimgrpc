name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NGHTTP2_VERSION: 1.71.0
  NGHTTP2_SHA256: c0f55121d88650e4b9227aec28cebaf664d2417ca60fe70be0f8d38829f52116
  # nim-lang.org has no linux arm64 binary: this one is built once from the release source by
  # https://github.com/zystem/Nim/tree/arm64-binaries (Nim 2.4.0, the only version of the arm64 job)
  NIM_ARM64_SHA256: 1524ab802ab20ff5abd812af3e7aa2d0541426c3c1b0e91001ee37125308082f

jobs:
  test:
    name: tests (${{ matrix.mode }}, Nim ${{ matrix.nim }}${{ matrix.runner == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, asan, coverage]
        # the oldest Nim that nimgrpc.nimble allows, the last 2.2 and the current stable one
        nim: ["2.2.12", "2.2.14", "2.4.0"]
        runner: [ubuntu-latest]
        include:
          # arm64: the other CPU the library is likely to meet; BearSSL picks other code there.
          # Its compiler is the binary of NIM_ARM64_SHA256 above.
          - mode: plain
            nim: "2.4.0"
            runner: ubuntu-24.04-arm
        exclude:
          - mode: coverage          # one Nim version is enough for the coverage figure
            nim: "2.2.14"
          - mode: coverage
            nim: "2.4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake zlib1g-dev xz-utils
      - name: nghttp2 cache
        id: ng
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/nghttp2
          key: nghttp2-${{ env.NGHTTP2_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build nghttp2 (static, as docs/building.md)
        if: steps.ng.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/nghttp2/nghttp2/releases/download/v${NGHTTP2_VERSION}/nghttp2-${NGHTTP2_VERSION}.tar.xz"
          echo "${NGHTTP2_SHA256}  nghttp2-${NGHTTP2_VERSION}.tar.xz" | sha256sum -c -
          tar xf "nghttp2-${NGHTTP2_VERSION}.tar.xz"
          cd "nghttp2-${NGHTTP2_VERSION}"
          cmake -S . -B build -DENABLE_LIB_ONLY=ON -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/nghttp2
          cmake --build build -j
          sudo cmake --install build
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        if: runner.arch != 'ARM64'
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Nim for arm64
        if: runner.arch == 'ARM64'
        env:
          NIM_VERSION: ${{ matrix.nim }}
        run: |
          file="nim-${NIM_VERSION}-linux_arm64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/zystem/Nim/releases/download/arm64-nim-${NIM_VERSION}/${file}"
          echo "${NIM_ARM64_SHA256}  ${file}" | sha256sum -c -
          tar -xJf "$file"
          echo "$RUNNER_TEMP/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
      - run: nimble install -y --depsOnly
      - name: Style and warnings (nimble lint)
        if: matrix.mode == 'plain'
        run: nimble lint
      - name: Run all test files
        run: |
          case "${{ matrix.mode }}" in
            asan) nimble asan ;;
            coverage) tools/coverage.sh ;;
            *) nimble test ;;
          esac
